<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#20364a"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#20364a">Proteção contextual e atendimento educativo</text>
<text x="500" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">O problema de pesquisa: a mesma palavra pode aparecer em intenções diferentes.</text>
<polyline points="180,380 180,415 500,415 500,445" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,380 500,415 500,415 500,445" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="820,380 820,415 500,415 500,445" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="150" width="280" height="230" rx="7" fill="#fbeeee" stroke="#a14b4b" stroke-width="1.8"/>
<text x="180.0" y="220.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">1  Permissividade</text>
<text x="180.0" y="250.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Resposta fluente não basta.</text>
<text x="180.0" y="275.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Um pedido prejudicial pode</text>
<text x="180.0" y="300.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">receber instruções de dano.</text>
<text x="180.0" y="325.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Risco: liberação inadequada.</text>
<rect x="360" y="150" width="280" height="230" rx="7" fill="#fff6e8" stroke="#9c702e" stroke-width="1.8"/>
<text x="500.0" y="220.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">2  Restrição excessiva</text>
<text x="500.0" y="250.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Palavra sensível não basta.</text>
<text x="500.0" y="275.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Uma dúvida escolar pode</text>
<text x="500.0" y="300.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">ser recusada sem necessidade.</text>
<text x="500.0" y="325.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Risco: bloqueio indevido.</text>
<rect x="680" y="150" width="280" height="230" rx="7" fill="#edf6f2" stroke="#367260" stroke-width="1.8"/>
<text x="820.0" y="220.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">3  Leitura contextual</text>
<text x="820.0" y="250.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Examinar intenção e contexto.</text>
<text x="820.0" y="275.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Distinguir educação e risco.</text>
<text x="820.0" y="300.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Oferecer cuidado na ajuda.</text>
<text x="820.0" y="325.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Conferir apoio nas fontes.</text>
<rect x="110" y="445" width="780" height="95" rx="7" fill="#eef4fb" stroke="#426b95" stroke-width="1.8"/>
<text x="500.0" y="485.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Avaliar dimensões separadas</text>
<text x="500.0" y="515.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Segurança  |  Tratamento  |  Correção  |  Sustentação  |  Clareza</text>
<text x="500" y="595" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">Quadro conceitual. As três situações não são condições experimentais da POC atual.</text>
</svg>