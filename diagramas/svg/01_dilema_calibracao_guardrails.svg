<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="1100" height="650" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="1100" height="650" fill="#ffffff" />
  <text x="550.0" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A365D">Figura 1 — O dilema de calibração de guardrails em chatbots educativos infantis (Segurança vs. Utilidade)</text>
  <rect x="310" y="65" width="480" height="65" rx="8" ry="8" fill="#dae8fc" stroke="#1A365D" stroke-width="1.8"  />
  <text x="550.0" y="94.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Solicitação do Estudante (7 a 11 anos | Perfil Fictício: 9 anos / 4º ano)</text>
  <text x="550.0" y="109.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Dúvidas de Ciências (Seres Vivos), Casos Ambíguos (Predação) ou Solicitações de Risco</text>
  <rect x="40" y="180" width="310" height="410" rx="8" ry="8" fill="#fdf2f2" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7,5" />
  <text x="195.0" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1. Política Excessivamente Permissiva</text>
  <rect x="65" y="225" width="260" height="75" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="195.0" y="259.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Sem Guardrails Dedicados à Infância</text>
  <text x="195.0" y="274.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(Apenas alinhamento nativo adulto do LLM)</text>
  <rect x="65" y="335" width="260" height="85" rx="8" ry="8" fill="#ffffff" stroke="#b85450" stroke-width="1.8"  />
  <text x="195.0" y="366.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Falha em solicitações nocivas infantis</text>
  <text x="195.0" y="381.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">e alucinações fora do currículo escolar</text>
  <text x="195.0" y="397.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(Rath et al., 2025; Khoo et al., 2025)</text>
  <rect x="65" y="455" width="260" height="105" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="195.0" y="488.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Efeito nos Indicadores:</text>
  <text x="195.0" y="504.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Taxa de Respostas Inadequadas ALTA (T_RI ↑)</text>
  <text x="195.0" y="519.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Criança exposta a conteúdos impróprios</text>
  <text x="195.0" y="534.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(51% a 64% de falha em LLMs gerais)</text>
  <rect x="395" y="180" width="310" height="410" rx="8" ry="8" fill="#fffdf0" stroke="#d6b656" stroke-width="1.8" stroke-dasharray="7,5" />
  <text x="550.0" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">2. Política Excessivamente Restritiva</text>
  <rect x="420" y="225" width="260" height="75" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="550.0" y="259.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Filtro Rígido Descontextualizado</text>
  <text x="550.0" y="274.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(Bloqueio por palavras sensíveis: &#x27;morte&#x27;, &#x27;comer&#x27;)</text>
  <rect x="420" y="335" width="260" height="85" rx="8" ry="8" fill="#ffffff" stroke="#d6b656" stroke-width="1.8"  />
  <text x="550.0" y="366.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Rejeita dúvidas legítimas de Ciências</text>
  <text x="550.0" y="381.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">sobre predação na cadeia alimentar</text>
  <text x="550.0" y="397.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(Ex.: &#x27;Por que o falcão come o esquilo?&#x27;)</text>
  <rect x="420" y="455" width="260" height="105" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="550.0" y="488.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Efeito nos Indicadores:</text>
  <text x="550.0" y="504.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Taxa de Bloqueios Indevidos ALTA (T_BI ↑)</text>
  <text x="550.0" y="519.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Alto Custo de Segurança (Safety Cost)</text>
  <text x="550.0" y="534.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Prejuízo à utilidade pedagógica</text>
  <rect x="750" y="180" width="310" height="410" rx="8" ry="8" fill="#f0f9f0" stroke="#82b366" stroke-width="1.8" stroke-dasharray="7,5" />
  <text x="905.0" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">3. Guardrails Contextuais Configuráveis (GuardKids)</text>
  <rect x="775" y="225" width="260" height="75" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="905.0" y="251.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Guardrails de Entrada/Saída + RAG</text>
  <text x="905.0" y="266.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Pondera Risco Real vs. Contexto Educativo</text>
  <text x="905.0" y="282.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(Classificação Indicativa — Brasil, 2025)</text>
  <rect x="775" y="335" width="260" height="85" rx="8" ry="8" fill="#ffffff" stroke="#82b366" stroke-width="1.8"  />
  <text x="905.0" y="366.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bloqueia instruções de dano (needs_protection)</text>
  <text x="905.0" y="381.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">e permite predação ecológica ancorada</text>
  <text x="905.0" y="397.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">na apostila do 4º ano (ajuste pontual)</text>
  <rect x="775" y="455" width="260" height="105" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="905.0" y="488.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Equilíbrio Alvo no TCC:</text>
  <text x="905.0" y="504.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Respostas Inadequadas Minimizadas (T_RI = 0%)</text>
  <text x="905.0" y="519.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Bloqueios Indevidos Eliminados (T_BI ↓)</text>
  <text x="905.0" y="534.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Respostas corretas, pertinentes e claras</text>
  <path d="M 406.0 130.0 L 195.0 155.0 L 195.0 225.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 550.0 130.0 L 550.0 225.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 694.0 130.0 L 905.0 155.0 L 905.0 225.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 195.0 300.0 L 195.0 335.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 195.0 420.0 L 195.0 455.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 550.0 300.0 L 550.0 335.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 550.0 420.0 L 550.0 455.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 905.0 300.0 L 905.0 335.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 905.0 420.0 L 905.0 455.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
</svg>