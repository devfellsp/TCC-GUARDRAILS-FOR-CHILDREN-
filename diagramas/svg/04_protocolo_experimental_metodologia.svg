<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690" width="1100" height="690" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="1100" height="690" fill="#ffffff" />
  <text x="550.0" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A365D">Figura 4 — Protocolo experimental controlado para avaliação comparativa das configurações de guardrails</text>
  <rect x="50" y="65" width="470" height="130" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="285.0" y="103.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Variáveis Controladas (Fixas entre Configurações)</text>
  <text x="285.0" y="119.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Modelo: Qwen3 8B (Q4_K_M local) | Embeddings: BGE-M3</text>
  <text x="285.0" y="134.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Acervo RAG: 5 trechos revisados das apostilas (4º ano)</text>
  <text x="285.0" y="149.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Perfil: Criança de 9 anos (4º ano EF — Ciências)</text>
  <text x="285.0" y="165.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Hiperparâmetros: temp=0, seed=42, top_p=0,9, rep=1,1</text>
  <rect x="570" y="65" width="480" height="130" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="810.0" y="103.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Amostra Intencional de Perguntas (Tabela 3)</text>
  <text x="810.0" y="119.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Grupo 1: Educativas legítimas com apoio no acervo</text>
  <text x="810.0" y="134.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Grupo 2: Educativas ambíguas (ex.: predação animal)</text>
  <text x="810.0" y="149.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Grupo 3: Educativas sem apoio no acervo (fuga de escopo)</text>
  <text x="810.0" y="165.0" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Grupo 4: Solicitações de risco (Categorias 1 a 6 — MinorBench)</text>
  <rect x="100" y="255" width="380" height="115" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="290.0" y="293.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Execução em Lote — Configuração REFERENCIA</text>
  <text x="290.0" y="309.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(allow_educational_predation = false)</text>
  <text x="290.0" y="324.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Sessões independentes de turno único</text>
  <text x="290.0" y="339.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Registro auditável em JSONL + CSV</text>
  <rect x="620" y="255" width="380" height="115" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="810.0" y="293.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Execução em Lote — Configuração AJUSTADA</text>
  <text x="810.0" y="309.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(allow_educational_predation = true)</text>
  <text x="810.0" y="324.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Mesma amostra e condições constantes</text>
  <text x="810.0" y="339.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Única variação: regra de contexto educativo</text>
  <rect x="70" y="435" width="460" height="135" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="300.0" y="476.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Indicadores Quantitativos de Segurança e Utilidade</text>
  <text x="300.0" y="491.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Taxa de Respostas Inadequadas: T_RI = (N_RI / N_V) × 100</text>
  <text x="300.0" y="506.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Taxa de Bloqueios Indevidos: T_BI = (N_BI / N_L) × 100</text>
  <text x="300.0" y="522.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Proporção de Solicitações de Risco Tratadas Adequadamente</text>
  <text x="300.0" y="537.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Contabilização de execuções válidas, perdas e inconclusivos</text>
  <rect x="570" y="435" width="460" height="135" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="800.0" y="476.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Avaliação Qualitativa das Respostas Permitidas (Tabela 4)</text>
  <text x="800.0" y="491.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• 1. Correção (fidelidade às páginas das apostilas)</text>
  <text x="800.0" y="506.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• 2. Pertinência (atendimento direto à dúvida formulada)</text>
  <text x="800.0" y="522.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• 3. Clareza (adequação ao perfil de 9 anos / 4º ano)</text>
  <text x="800.0" y="537.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Classificação: Integral | Parcial | Ausente (+ não sustentadas)</text>
  <rect x="250" y="605" width="600" height="55" rx="8" ry="8" fill="#dae8fc" stroke="#1A365D" stroke-width="1.8"  />
  <text x="550.0" y="629.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Análise Comparativa Pareada (referencia vs. ajustada)</text>
  <text x="550.0" y="644.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Identificação dos casos com mudança de decisão e resposta à Pergunta de Pesquisa</text>
