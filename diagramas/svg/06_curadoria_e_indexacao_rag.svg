<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="1100" height="660" fill="#ffffff" />
  <text x="550.0" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A365D">Figura 6 — Processo de curadoria documental, recorte por âncoras e indexação vetorial do acervo do 4º ano</text>
  <rect x="60" y="70" width="450" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="285.0" y="99.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Fonte Pública 1: Trilhas de Aprendizagens — 4º ano, v. 2, 2. ed.</text>
  <text x="285.0" y="114.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Secretaria Municipal de Educação de São Paulo (São Paulo, 2021)</text>
  <text x="285.0" y="129.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Licença aberta (CC BY-NC-SA 4.0) — Ciências: Cadeias Alimentares</text>
  <rect x="590" y="70" width="450" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="815.0" y="99.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Fonte Pública 2: Currículo em Ação — Livro do Estudante (4º ano, v. 2)</text>
  <text x="815.0" y="114.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Secretaria da Educação do Estado de São Paulo (São Paulo, 2024)</text>
  <text x="815.0" y="129.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">2º Bimestre — Ciências: Alimentação dos Seres Vivos e Decompositores</text>
  <rect x="200" y="185" width="700" height="80" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="550.0" y="214.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Conferência Pedagógica e Recorte Auditável (poc/corpus_manifest.json)</text>
  <text x="550.0" y="229.3" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Seleção de textos explicativos autocontidos (compreensíveis sem imagens/vídeos)</text>
  <text x="550.0" y="244.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Delimitação exata por âncoras textuais (start_anchor, end_anchor e exclude_From_anchor)</text>
  <rect x="50" y="305" width="440" height="165" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="270.0" y="353.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Conteúdos Explicitamente Excluídos na Curadoria</text>
  <text x="270.0" y="368.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• p. 153 (Trilhas, 2021): texto curto dependente de vídeos externos</text>
  <text x="270.0" y="384.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• p. 12 (SEDUC-SP, 2024): mistura cadeia alimentar e ecossistema</text>
  <text x="270.0" y="399.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• p. 22 (SEDUC-SP, 2024): formulação imprecisa sobre fluxo não</text>
  <text x="270.0" y="414.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">  unidirecional e &#x27;produção&#x27; de energia pelos seres vivos</text>
  <text x="270.0" y="430.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Exercícios de lacunas, V ou F, legendas de figuras e QR codes</text>
  <rect x="540" y="305" width="510" height="165" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="795.0" y="353.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">5 Páginas Aprovadas e Extraídas via pypdf (5 Chunks)</text>
  <text x="795.0" y="368.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• trilhas2021-p154-1 (p. 154): produtores, esquilo e falcão (predação)</text>
  <text x="795.0" y="384.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• sp2024-p8-1 (p. 8): nutrientes, energia e alimentação dos seres vivos</text>
  <text x="795.0" y="399.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• sp2024-p9-1 (p. 9): animais onívoros e produtores (fotossíntese)</text>
  <text x="795.0" y="414.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• sp2024-p13-1 (p. 13): consumidores (herbívoros/carnívoros) e decompositores</text>
  <text x="795.0" y="430.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• sp2024-p27-1 (p. 27): reciclagem da matéria orgânica por fungos/bactérias</text>
  <rect x="540" y="515" width="510" height="105" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="795.0" y="548.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Segmentação e Indexação Vetorial Densa (guardkids.py index — 6,87 s)</text>
  <text x="795.0" y="564.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Divisão até 850 caracteres com sobreposição de 1 sentença (sentence_overlap=1)</text>
  <text x="795.0" y="579.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Geração de embeddings em CPU com bge-m3:latest (1.024 dimensões, norma L2)</text>
  <text x="795.0" y="594.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">• Persistência auditável em poc/data/chunks.json e poc/data/index.npz (SHA-256)</text>
  <path d="M 285.0 150.0 L 410.0 185.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 815.0 150.0 L 690.0 185.0" fill="none" stroke="#333333" stroke-width="1.8"  marker-end="url(#arrow)" />
  <path d="M 375.0 265.0 L 270.0 305.0" fill="none" stroke="#b85450" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="281.8" y="276.0" width="81.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="322.5" y="289.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">Descartados</text>
  <path d="M 725.0 265.0 L 795.0 305.0" fill="none" stroke="#2d6a4f" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="725.8" y="276.0" width="68.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="760.0" y="289.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">Aprovados</text>
  <path d="M 795.0 470.0 L 795.0 515.0" fill="none" stroke="#2d6a4f" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="754.2" y="483.5" width="81.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="795.0" y="496.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">Vetorização</text>
</svg>