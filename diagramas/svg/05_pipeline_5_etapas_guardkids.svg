<text x="890" y="603" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#367260">aprovada</text>
<text x="500" y="738" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">O caminho aprovado libera a explicação com fontes após a etapa 5 e a persistência.</text>
