<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 740" width="1150" height="740" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="1150" height="740" fill="#ffffff" />
  <text x="575.0" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A365D">Figura 5 — Pipeline sequencial de cinco etapas implementado no protótipo GuardKids (poc/guardkids_core/pipeline.py)</text>
  <rect x="60" y="65" width="520" height="50" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="320.0" y="86.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Entrada: Pergunta do Estudante + Configuração Ativa (referencia ou ajustada)</text>
  <text x="320.0" y="102.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Endpoint POST /api/chat ou Executor em Lote (guardkids.py batch)</text>
  <rect x="60" y="145" width="520" height="75" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="320.0" y="171.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ETAPA 1 — Guardrail de Entrada (Input Guardrail)</text>
  <text x="320.0" y="186.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Regra determinística (Regex) para dados pessoais explícitos (nome, endereço, escola)</text>
  <text x="320.0" y="202.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Classificador contextual Qwen3 8B (Classification JSON: category, needs_protection, educational_predation)</text>
  <polygon points="705.0,145 780,182.5 705.0,220 630,182.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
  <text x="705.0" y="179.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Permitida</text>
  <text x="705.0" y="193.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">na Entrada?</text>
  <rect x="840" y="145" width="260" height="75" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="970.0" y="171.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bloqueio / Orientação na Entrada</text>
  <text x="970.0" y="186.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(final_status = block)</text>
  <text x="970.0" y="202.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Retorna mensagem da política</text>
  <rect x="60" y="255" width="520" height="75" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="320.0" y="281.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ETAPA 2 — Recuperação Vetorial (RAG) e Guardrail de Escopo</text>
  <text x="320.0" y="296.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Embedding da pergunta via bge-m3:latest em CPU (vetor normalizado 1.024 dim)</text>
  <text x="320.0" y="312.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Busca por similaridade cosseno em data/index.npz (top_k = 3, limiar min_similarity = 0,45)</text>
  <polygon points="705.0,255 780,292.5 705.0,330 630,292.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
  <text x="705.0" y="289.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Similaridade</text>
  <text x="705.0" y="303.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">máx &gt;= 0,45?</text>
  <rect x="840" y="255" width="260" height="75" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="970.0" y="281.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Fora do Escopo Curricular</text>
  <text x="970.0" y="296.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(final_status = out_of_scope)</text>
  <text x="970.0" y="312.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Redirecionamento educativo</text>
  <rect x="60" y="365" width="520" height="70" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="320.0" y="389.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ETAPA 3 — Geração Educativa Ancorada (Qwen3 8B)</text>
  <text x="320.0" y="404.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Contexto restrito aos trechos recuperados (tratados como dados, sem autoridade de comando)</text>
  <text x="320.0" y="419.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• temp=0, seed=42, think=false → Generation JSON (supported, answer, source_ids)</text>
  <rect x="60" y="465" width="520" height="70" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="320.0" y="489.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ETAPA 4 — Guardrail de Sustentação e Integridade de Citação</text>
  <text x="320.0" y="504.3" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Verifica se supported == true, se answer não é vazia e se todos os source_ids</text>
  <text x="320.0" y="519.7" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">  citados pertencem exatamente ao subconjunto de trechos recuperados na Etapa 2</text>
  <polygon points="705.0,462 780,499.5 705.0,537 630,499.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
  <text x="705.0" y="496.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Sustentada e</text>
  <text x="705.0" y="510.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">IDs válidos?</text>
  <rect x="840" y="462" width="260" height="75" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="970.0" y="488.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Insuficiência / Citação Inválida</text>
  <text x="970.0" y="503.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(final_status = out_of_scope)</text>
  <text x="970.0" y="519.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Evita alucinação não ancorada</text>
  <rect x="60" y="565" width="520" height="75" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="320.0" y="591.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ETAPA 5 — Guardrail de Saída (Output Guardrail)</text>
  <text x="320.0" y="606.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Nova inspeção contextual do rascunho answer pelo classificador Qwen3 8B</text>
  <text x="320.0" y="622.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Aplica a mesma política ativa (referencia ou ajustada) antes da exibição à criança</text>
  <polygon points="705.0,565 780,602.5 705.0,640 630,602.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
  <text x="705.0" y="599.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Saída</text>
  <text x="705.0" y="613.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Segura?</text>
  <rect x="840" y="565" width="260" height="75" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="970.0" y="591.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bloqueio na Saída (block)</text>
  <text x="970.0" y="606.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Retém rascunho em rejected_response</text>
  <text x="970.0" y="622.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(oculto na API) e exibe proteção</text>
  <rect x="60" y="665" width="520" height="55" rx="8" ry="8" fill="#d5e8d4" stroke="#2d6a4f" stroke-width="1.8"  />
  <text x="320.0" y="689.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Resposta Educativa Disponibilizada (final_status = allow)</text>
  <text x="320.0" y="704.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Exibe explicação clara para 9 anos acompanhada das fontes citadas (source_ids)</text>
  <rect x="630" y="665" width="470" height="55" rx="8" ry="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.8"  />
  <text x="865.0" y="689.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Auditoria em logs/runs.jsonl (Todas as Execuções)</text>
  <text x="865.0" y="704.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Grava decisões de entrada/saída, trechos, tempos e hashes SHA-256</text>
