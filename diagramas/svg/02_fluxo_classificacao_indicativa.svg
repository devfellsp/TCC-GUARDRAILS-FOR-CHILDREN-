<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="1100" height="680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="1100" height="680" fill="#ffffff" />
  <text x="550.0" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A365D">Figura 2 — Fluxo decisório da Classificação Indicativa brasileira (Brasil, 2025) aplicado a guardrails contextuais</text>
  <rect x="350" y="60" width="400" height="55" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.8"  />
  <text x="550.0" y="84.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Mensagem na Interação (Pergunta da Criança ou Rascunho de Resposta)</text>
  <text x="550.0" y="99.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Perfil de Referência: 9 anos (4º ano do Ensino Fundamental)</text>
  <rect x="280" y="145" width="540" height="80" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="550.0" y="181.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">FASE 1: Análise Descritiva (Identificação Temática Preliminar — Brasil, 2025)</text>
  <text x="550.0" y="197.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Inspeção nos 4 eixos: (1) Violência | (2) Sexo e Nudez | (3) Drogas | (4) Interatividade (IA e Dados)</text>
  <polygon points="550.0,255 690,302.5 550.0,350 410,302.5" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8" />
  <text x="550.0" y="292.4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Contém tema sensível</text>
  <text x="550.0" y="306.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">ou descritor restrito</text>
  <text x="550.0" y="320.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">para 9 anos?</text>
  <rect x="50" y="270" width="260" height="65" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="180.0" y="291.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Conteúdo Livre (normal)</text>
  <text x="180.0" y="306.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">Dúvida escolar sem vocábulos</text>
  <text x="180.0" y="322.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">de violência, sexo, drogas ou PII</text>
  <rect x="310" y="390" width="480" height="70" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.8"  />
  <text x="550.0" y="421.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">FASE 2: Análise Contextual (Ponderação de Agravantes vs. Atenuantes)</text>
  <text x="550.0" y="437.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Avalia propósito, detalhamento, incitação ao dano ou finalidade científica/escolar</text>
  <rect x="690" y="495" width="360" height="145" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.8"  />
  <text x="870.0" y="533.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Presença de AGRAVANTES (needs_protection = true)</text>
  <text x="870.0" y="548.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Violência gráfica ou crueldade contra animal (A.4.5)</text>
  <text x="870.0" y="564.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Autolesão / suicídio (NR 14–18) ou Bullying</text>
  <text x="870.0" y="579.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Sexo explícito / linguagem chula / Drogas</text>
  <text x="870.0" y="594.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Coleta de dados pessoais (D.6.1) ou Prompt Injection</text>
  <text x="870.0" y="610.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">→ DECISÃO: Bloqueio ou Orientação Segura</text>
  <rect x="50" y="495" width="370" height="145" rx="8" ry="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.8"  />
  <text x="235.0" y="533.4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Presença de ATENUANTE EDUCATIVO (Brasil, 2025)</text>
  <text x="235.0" y="548.8" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Contexto científico/escolar do 4º ano (Seres Vivos)</text>
  <text x="235.0" y="564.1" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• Predação natural na cadeia alimentar sem crueldade</text>
  <text x="235.0" y="579.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">• IA generativa educacional controlada (D.3.1 — 10 anos)</text>
  <text x="235.0" y="594.9" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">(needs_protection = false | educational_predation = true)</text>
  <text x="235.0" y="610.2" text-anchor="middle" font-size="12" font-weight="normal" fill="#1a1a1a">→ DECISÃO: Submetida à Política Configurável</text>
  <rect x="455" y="520" width="195" height="95" rx="8" ry="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.8"  />
  <text x="552.5" y="548.8" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Prossegue ao RAG</text>
  <text x="552.5" y="564.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">e Geração Ancorada</text>
  <text x="552.5" y="579.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">(Se política permitir</text>
  <text x="552.5" y="594.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">contexto educativo)</text>
