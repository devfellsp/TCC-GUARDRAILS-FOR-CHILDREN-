<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#20364a"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#20364a">Da referência de risco à decisão contextual</text>
<text x="500" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">Descritores orientam a análise; a decisão depende também da intenção e do apoio documental.</text>
<rect x="30" y="120" width="285" height="470" rx="9" fill="#f4f5f6" stroke="#73808c" stroke-dasharray="6 5"/>
<text x="172.5" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">A  REFERÊNCIAS</text>
<rect x="355" y="120" width="285" height="470" rx="9" fill="#eef4fb" stroke="#426b95" stroke-dasharray="6 5"/>
<text x="497.5" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">B  CONTEXTO</text>
<rect x="680" y="120" width="290" height="470" rx="9" fill="#edf6f2" stroke="#367260" stroke-dasharray="6 5"/>
<text x="825.0" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">C  TRATAMENTO</text>
<polyline points="295.0,330.0 375.0,330.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="620,330 657,330 657,227 700,227" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="657,330 657,357 700,357" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="657,357 657,487 700,487" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="195" width="245" height="270" rx="7" fill="#f4f5f6" stroke="#73808c" stroke-width="1.8"/>
<text x="172.5" y="272.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Categorias de cuidado</text>
<text x="172.5" y="302.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Perigo e autolesão</text>
<text x="172.5" y="327.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Sexual e ofensas</text>
<text x="172.5" y="352.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Substâncias e privacidade</text>
<text x="172.5" y="377.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Injeção de instruções</text>
<text x="172.5" y="402.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Guia ClassInd e literatura</text>
<rect x="375" y="195" width="245" height="270" rx="7" fill="#eef4fb" stroke="#426b95" stroke-width="1.8"/>
<text x="497.5" y="272.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Leitura da solicitação</text>
<text x="497.5" y="302.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">O que a pessoa pretende?</text>
<text x="497.5" y="327.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Pede dano ou pede ajuda?</text>
<text x="497.5" y="352.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">É uma dúvida educativa?</text>
<text x="497.5" y="377.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Qual é o chat escolhido?</text>
<text x="497.5" y="402.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">O acervo pode responder?</text>
<rect x="700" y="180" width="250" height="95" rx="7" fill="#fbeeee" stroke="#a14b4b" stroke-width="1.8"/>
<text x="825.0" y="220.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Intervir</text>
<text x="825.0" y="250.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Bloqueio ou cuidado fixo</text>
<rect x="700" y="310" width="250" height="95" rx="7" fill="#edf6f2" stroke="#367260" stroke-width="1.8"/>
<text x="825.0" y="350.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Prosseguir</text>
<text x="825.0" y="380.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Gerar e verificar a resposta</text>
<rect x="700" y="440" width="250" height="95" rx="7" fill="#fff6e8" stroke="#9c702e" stroke-width="1.8"/>
<text x="825.0" y="480.0" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Comunicar limite</text>
<text x="825.0" y="510.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Falta de apoio no acervo</text>
<text x="500" y="640" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">A referência classificatória não representa uma classificação oficial do chatbot.</text>
<text x="500" y="674" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">Perfil operacional: nove anos fictícios. A adequação à faixa de 7-11 anos não foi demonstrada.</text>
</svg>