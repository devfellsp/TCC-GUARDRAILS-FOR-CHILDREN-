  <rect x="345.2" y="293.5" width="29.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="360.0" y="306.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">Não</text>
  <path d="M 550.0 350.0 L 550.0 390.0" fill="none" stroke="#9c6615" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="535.2" y="361.0" width="29.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="550.0" y="374.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c6615">Sim</text>
  <path d="M 670.0 460.0 L 870.0 475.0 L 870.0 495.0" fill="none" stroke="#b85450" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="706.5" y="458.5" width="127.0" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="770.0" y="471.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">Agravante de Risco</text>
  <path d="M 430.0 460.0 L 235.0 475.0 L 235.0 495.0" fill="none" stroke="#9c6615" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="265.8" y="458.5" width="133.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="332.5" y="471.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#9c6615">Atenuante Educativo</text>
  <path d="M 420.0 567.5 L 455.0 567.5" fill="none" stroke="#2d6a4f" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="406.5" y="551.5" width="62.0" height="32.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="437.5" y="564.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">ajustada</text>
  <text x="437.5" y="578.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">(allow)</text>
  <path d="M 180.0 335.0 L 180.0 480.0 L 552.0 480.0 L 552.5 520.0" fill="none" stroke="#2d6a4f" stroke-width="1.8"  marker-end="url(#arrow)" />
  <rect x="344.8" y="471.0" width="42.5" height="18.0" rx="3" fill="#ffffff" stroke="none" opacity="0.92" />
  <text x="366.0" y="484.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d6a4f">allow</text>
</svg>