<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#20364a"/></marker></defs>
<rect width="1000" height="100%" fill="white"/>
<text x="500" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#20364a">Arquitetura do GuardKids por camadas</text>
<text x="500" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">Regra comum nos quatro chats; apenas o estilo da explicação varia entre condições.</text>
<rect x="35" y="190" width="930" height="230" rx="9" fill="#f4f5f6" stroke="#73808c" stroke-dasharray="6 5"/>
<text x="500.0" y="225" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">A  ENTRADA, BUSCA E GERAÇÃO</text>
<rect x="35" y="435" width="930" height="230" rx="9" fill="#f4f5f6" stroke="#73808c" stroke-dasharray="6 5"/>
<text x="500.0" y="470" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">B  VERIFICAÇÃO E ENTREGA</text>
<polyline points="180,177 180,245" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="310.0,325.0 370.0,325.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="630.0,325.0 690.0,325.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="820.0,405.0 820.0,490.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="690.0,570.0 630.0,570.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="370.0,570.0 310.0,570.0" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="180,650 180,690" fill="none" stroke="#20364a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="105" width="900" height="72" rx="7" fill="#f4f5f6" stroke="#73808c" stroke-width="1.8"/>
<text x="500.0" y="133.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Contexto da tentativa</text>
<text x="500.0" y="163.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Pergunta + chat  |  Perfil fictício de 9 anos  |  Regra comum  |  Direto ou Passo a passo</text>
<rect x="50" y="245" width="260" height="160" rx="7" fill="#eef4fb" stroke="#426b95" stroke-width="1.8"/>
<text x="180.0" y="292.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">1  Proteção de entrada</text>
<text x="180.0" y="322.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Detector parcial de dados</text>
<text x="180.0" y="347.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Classificação de intenção</text>
<text x="180.0" y="372.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Intervenção tem precedência</text>
<rect x="370" y="245" width="260" height="160" rx="7" fill="#eef4fb" stroke="#426b95" stroke-width="1.8"/>
<text x="500.0" y="292.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">2  Recuperação no chat</text>
<text x="500.0" y="322.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Índice validado: 8 trechos</text>
<text x="500.0" y="347.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Embeddings com BGE-M3</text>
<text x="500.0" y="372.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Até 3 trechos; limiar 0,45</text>
<rect x="690" y="245" width="260" height="160" rx="7" fill="#edf6f2" stroke="#367260" stroke-width="1.8"/>
<text x="820.0" y="292.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">3  Geração com fontes</text>
<text x="820.0" y="322.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Qwen3:8b + estilo escolhido</text>
<text x="820.0" y="347.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Resposta estruturada</text>
<text x="820.0" y="372.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Limite de 120 palavras</text>
<rect x="690" y="490" width="260" height="160" rx="7" fill="#f3eff8" stroke="#78628f" stroke-width="1.8"/>
<text x="820.0" y="537.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">4  Apoio documental</text>
<text x="820.0" y="567.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Conferir IDs e extensão</text>
<text x="820.0" y="592.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Detector parcial de dados</text>
<text x="820.0" y="617.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Verificação de sustentação</text>
<rect x="370" y="490" width="260" height="160" rx="7" fill="#eef4fb" stroke="#426b95" stroke-width="1.8"/>
<text x="500.0" y="537.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">5  Proteção de saída</text>
<text x="500.0" y="567.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Classificar o texto gerado</text>
<text x="500.0" y="592.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Aplicar a regra comum</text>
<text x="500.0" y="617.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Reter rascunho reprovado</text>
<rect x="50" y="490" width="260" height="160" rx="7" fill="#f4f5f6" stroke="#73808c" stroke-width="1.8"/>
<text x="180.0" y="537.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">6  Registro da tentativa</text>
<text x="180.0" y="567.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Persistência antes da saída</text>
<text x="180.0" y="592.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Comum: texto minimizado</text>
<text x="180.0" y="617.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Fictício: registro integral</text>
<rect x="50" y="690" width="900" height="66" rx="7" fill="#edf6f2" stroke="#367260" stroke-width="1.8"/>
<text x="500.0" y="715.5" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#20364a">Mensagem exibida</text>
<text x="500.0" y="745.5" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#20364a">Explicação com fontes, cuidado, recusa ou aviso de apoio insuficiente</text>
<text x="500" y="790" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#536574">Caminho completo: até quatro chamadas ao mesmo Qwen3. Intervenções podem encerrar antes.</text>
</svg>