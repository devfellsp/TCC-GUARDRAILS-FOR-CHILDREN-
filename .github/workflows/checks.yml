name: Verificacoes do GuardKids
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r poc/requirements-lock.txt
      - run: python -m pip check
      - run: python -m pytest poc/tests -q
      - run: node --test poc/tests/test_web.cjs
      - run: python tools/build_assets.py
      - name: Verificar artefatos gerados
        run: git diff --exit-code -- document.tex generated/
      - name: Auditar dependencias
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r poc/requirements-lock.txt
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-lang-portuguese texlive-fonts-recommended texlive-science texlive-publishers fonts-texgyre
      - name: Compilar documento principal
        run: |
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
